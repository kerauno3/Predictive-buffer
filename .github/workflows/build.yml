name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use older LLVM
      shell: pwsh
      run: choco install llvm --version=19.1.7 --allow-downgrade -y

    - name: Build the mod
      uses: geode-sdk/build-geode-mod@main
      with:
        bindings: geode-sdk/bindings
        bindings-ref: main
        combine: false
